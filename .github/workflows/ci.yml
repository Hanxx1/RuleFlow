name: core-checks
on: [push, pull_request]
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: python -m pip install -r server/requirements.txt -c server/requirements.lock
      - run: npm ci --prefix mobile
      - run: python -m pytest server/tests -q -p no:cacheprovider
      - run: python scripts/smoke-startup.py
      - run: python scripts/check-api-contract.py
      - run: python scripts/check-paths.py
      - run: node scripts/check-demo.mjs
      - run: npm test --prefix mobile
      - run: npm run build --prefix mobile
      - run: node scripts/test-harmony-rules.mjs
